baseURL = "https://eugenenie.top/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "我的博客"
theme = "PaperMod"
mainsections = ["posts"]
paginate = 10

# 允许文章里直接写 HTML（例如 <iframe> 内嵌视频）；Hugo 默认会把原生 HTML 丢掉
[markup.goldmark.renderer]
unsafe = true

[params]
  # 首页卡片网格模式，开启多列卡片
  homeMode = "cards"
  author = "你的名字"
  avatar = "/images/avatar.png" #头像放到 static/images/avatar.png
  # 开启页面功能
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true

  # 首页顶部欢迎信息。
  # 必须写在 [params] 下面（即 [params.homeInfoParams]）。
  # 之前写成了顶层的 [homeInfoParams]，主题读不到，于是首页把最新一篇
  # 当成「精选」用大标题展示（就是第三篇博客之前那个样子）。
  [params.homeInfoParams]
    Title = "欢迎来到我的博客"
    Content = "记录学习笔记与日常"

# 菜单
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 2

[[menu.main]]
name = "关于"
url = "/about/"
weight = 3
