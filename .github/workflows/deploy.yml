name: 构建并部署博客（阿里云）

# 只要往 main 分支推代码，就自动构建并发布到你的服务器
on:
  push:
    branches:
      - main
  workflow_dispatch: # 也可以在 Actions 页面手动点一次运行

# 同一时间只跑一个部署，新的推送会取消还没跑完的旧任务
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
    steps:
      - name: 拉取源码（含 PaperMod 主题子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Hugo extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: 构建站点
        run: hugo --minify --gc

      - name: 校验部署配置
        run: |
          missing=""
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PATH; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::仓库还缺这些 Secrets:$missing"
            echo "请在仓库 Settings → Secrets and variables → Actions 里补齐，再重新运行本工作流。"
            exit 1
          fi
          echo "配置齐全：$SSH_USER@$SSH_HOST:$SSH_PORT → $SSH_PATH"

      - name: 写入部署私钥和 SSH 配置
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host blog-deploy
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          echo "私钥与 SSH 配置已就绪"

      - name: 校验服务器站点目录
        run: |
          ssh blog-deploy "bash -s" -- "$SSH_PATH" <<'REMOTE'
          set -e
          p="$1"
          [ -d "$p" ] || { echo "::error::服务器上找不到目录：$p"; exit 1; }
          if [ -f "$p/index.html" ] || [ -z "$(ls -A "$p")" ]; then
            echo "目录校验通过：$p"
          else
            echo "::error::$p 里既没有 index.html 也不是空目录，为避免误删已中止（请确认 SSH_PATH 是否正确）"
            exit 1
          fi
          REMOTE

      - name: 部署前备份服务器上的旧站点
        continue-on-error: true
        run: |
          ssh blog-deploy "bash -s" -- "$SSH_PATH" <<'REMOTE'
          set -e
          p="${1%/}"
          ts=$(date +%Y%m%d-%H%M%S)
          tar czf "$p/../blog-backup-$ts.tgz" -C "$p" .
          ls -1t "$p"/../blog-backup-*.tgz | tail -n +6 | xargs -r rm -f
          echo "已备份：$p/../blog-backup-$ts.tgz（同名备份只保留最近 5 份）"
          REMOTE

      - name: rsync 同步 public 到服务器
        run: |
          rsync -rlptDz --delete --exclude '.well-known/' -e ssh ./public/ "blog-deploy:$SSH_PATH/"

      - name: 检查线上访问
        continue-on-error: true
        run: curl -sS -o /dev/null -w "https://eugenenie.top/ → HTTP %{http_code}\n" --max-time 20 https://eugenenie.top/
