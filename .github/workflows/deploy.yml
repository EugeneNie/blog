name: 构建并部署博客

# 只要往 main 分支推代码，就自动构建并发布
on:
  push:
    branches:
      - main
  workflow_dispatch: # 也可以在 Actions 页面手动点一次运行

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消还没跑完的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码（含 PaperMod 主题子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Hugo extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: 构建站点
        run: hugo --minify --gc

      - name: 打包 public 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
